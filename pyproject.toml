[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zv-klaerfall"
version = "0.1.0"
description = "Zahlungsverkehrs-Klärfallbearbeitung (ISO 20022 pain.001) mit Camunda 8: BPMN-Prozess, DMN-Klassifikation, Python-Worker, revisionssicherer Audit-Trail"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonathan Kuhn" }]
keywords = ["camunda", "bpmn", "dmn", "iso20022", "sepa", "pain.001", "zahlungsverkehr", "banking"]
dependencies = [
    "lxml>=5.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "schwifty>=2024.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
zv = "zv_klaerfall.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zv_klaerfall = ["iso20022/schemas/*.xsd", "data/*.json", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tools/generate_models.py" = ["E501"]  # XML-Vorlagen und Layout-Tabellen bleiben einzeilig lesbar
"tools/generate_samples.py" = ["E501"]
"tools/render_diagrams.py" = ["E501"]  # eingebettetes JavaScript
"tools/render_form.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: benötigt einen laufenden Camunda-8-Cluster (CAMUNDA_URL)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
packages = ["zv_klaerfall"]
mypy_path = "src"
