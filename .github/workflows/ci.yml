name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python · Ruff, Mypy, Pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: mypy
      - run: pytest --cov=zv_klaerfall --cov-report=term-missing
      - name: Offline-Durchlauf aller Beispiele
        run: zv demo --offline --no-reset

  models:
    name: BPMN/DMN · bpmnlint (camunda-cloud-8-9), dmnlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  generated-files:
    name: Generierte Modelle und Beispiele sind aktuell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python tools/generate_models.py && python tools/generate_samples.py
      - run: git diff --exit-code -- bpmn forms samples

  docker:
    name: Docker · Worker-Image baut, Compose ist valide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yaml config --quiet
      - run: docker build -f docker/Dockerfile -t zv-klaerfall-worker .

  integration:
    name: Integration · echter Camunda-8-Cluster
    runs-on: ubuntu-latest
    needs: [python, models]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Camunda starten
        run: |
          docker compose -f docker/docker-compose.yaml up -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v2/topology >/dev/null && break
            sleep 5
          done
          curl -sf http://localhost:8080/v2/topology
      - run: CAMUNDA_URL=http://localhost:8080 pytest -m integration -ra
      - name: Logs bei Fehler
        if: failure()
        run: docker compose -f docker/docker-compose.yaml logs --tail=200
      - if: always()
        run: docker compose -f docker/docker-compose.yaml down -v
